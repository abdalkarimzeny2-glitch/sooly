<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اعتراف خاص</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://images.unsplash.com/photo-1518199266739-6b6afa6a70bc?q=80&w=1920') no-repeat center center/cover;
            color: #fff;
            text-align: center;
        }
        .card {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 85%;
            color: #333;
        }
        h1 {
            color: #d9534f;
            font-size: 2.5rem;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        p {
            line-height: 1.8;
            font-size: 1.3rem;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>أميرة قلبي سولي </h1>
        <p>كل لحظة بقضيها معك عم تخليني شوف الحياة أحلى وأحلى ،،،،،حابب خبرك إنك أغلى وأجمل نعمة الله بعتلي ياها بهي الدنيا  ........ بحبك كتير يا أحلى أميرة بالعالم.....❤️</p>
    </div>
</body>
</html>
